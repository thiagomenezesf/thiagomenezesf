name: GitHub Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      # ==========================================
      # 📂 CHECKOUT DO REPOSITÓRIO
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 📊 CARD 1 - Estatísticas gerais
      # ==========================================
      - name: GitHub Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-stats.svg

          base: header, activity, community, repositories, metadata

          config_timezone: America/Sao_Paulo


      # ==========================================
      # 💻 CARD 2 - Linguagens
      # ==========================================
      - name: Top Linguagens
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-langs.svg

          base: ""

          plugin_languages: true
          plugin_languages_ignored: html, css
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: true


      # ==========================================
      # 📅 CARD 3 - Calendário de contribuições
      # ==========================================
      - name: Calendario de Contribuicoes
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-calendar-raw.svg

          base: ""

          plugin_calendar: true
          plugin_calendar_limit: 1

          config_timezone: America/Sao_Paulo


      # ==========================================
      # 🎨 PERSONALIZA O CALENDÁRIO
      # ==========================================
      - name: Personalizar calendario
        run: python .github/scripts/customize_calendar.py


      # ==========================================
      # 💾 SALVA O CALENDÁRIO PERSONALIZADO
      # ==========================================
      - name: Salvar calendario personalizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add github-calendar.svg

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no calendário."
          else
            git commit -m "Atualiza calendário de contribuições"
            git push
          fi
